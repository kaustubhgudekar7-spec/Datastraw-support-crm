<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support CRM — Tickets</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold text-slate-900">Support CRM</h1>
        <p class="text-sm text-slate-500">Datastraw customer support tickets</p>
      </div>
      <a href="/create" class="bg-slate-900 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-700 transition">
        + New Ticket
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex flex-col sm:flex-row gap-3 mb-5">
      <input
        id="searchInput"
        type="text"
        placeholder="Search by name, email, ticket ID, or keyword..."
        class="flex-1 border border-slate-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
      />
      <select id="statusFilter" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        <option value="">All statuses</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </div>

    <div id="emptyState" class="hidden text-center text-slate-400 py-16">
      No tickets found.
    </div>

    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-100 text-slate-500 text-left">
          <tr>
            <th class="px-4 py-3 font-medium">Ticket ID</th>
            <th class="px-4 py-3 font-medium">Customer</th>
            <th class="px-4 py-3 font-medium">Subject</th>
            <th class="px-4 py-3 font-medium">Priority</th>
            <th class="px-4 py-3 font-medium">Status</th>
            <th class="px-4 py-3 font-medium">Created</th>
          </tr>
        </thead>
        <tbody id="ticketTableBody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </main>

  <script>
    const tbody = document.getElementById("ticketTableBody");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");

    let debounceTimer;

    async function loadTickets() {
      const params = new URLSearchParams();
      if (searchInput.value.trim()) params.set("search", searchInput.value.trim());
      if (statusFilter.value) params.set("status", statusFilter.value);

      try {
        const tickets = await apiGet(`${API_BASE}?${params.toString()}`);
        renderTickets(tickets);
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-6 text-center text-red-500">Failed to load tickets.</td></tr>`;
      }
    }

    function renderTickets(tickets) {
      if (!tickets.length) {
        tbody.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }
      emptyState.classList.add("hidden");

      tbody.innerHTML = tickets
        .map(
          (t) => `
        <tr class="hover:bg-slate-50 cursor-pointer transition" onclick="window.location.href='/ticket?id=${t.ticket_id}'">
          <td class="px-4 py-3 font-mono text-slate-600">${t.ticket_id}</td>
          <td class="px-4 py-3">${escapeHtml(t.customer_name)}</td>
          <td class="px-4 py-3">${escapeHtml(t.subject)}</td>
          <td class="px-4 py-3">
            <span class="text-xs px-2 py-1 rounded-full ${priorityBadgeClass(t.priority)}">${t.priority}</span>
            ${t.is_sla_breached ? '<span class="ml-1 text-xs px-2 py-1 rounded-full bg-red-600 text-white">SLA breached</span>' : ""}
          </td>
          <td class="px-4 py-3">
            <span class="text-xs px-2 py-1 rounded-full ${statusBadgeClass(t.status)}">${t.status}</span>
          </td>
          <td class="px-4 py-3 text-slate-500">${formatDate(t.created_at)}</td>
        </tr>`
        )
        .join("");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadTickets, 250);
    });
    statusFilter.addEventListener("change", loadTickets);

    loadTickets();
  </script>
</body>
</html>
