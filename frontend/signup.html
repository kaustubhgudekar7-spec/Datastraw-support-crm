<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — Support CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <h1 class="text-xl font-semibold text-slate-900">Support CRM</h1>
      <p class="text-sm text-slate-500">Create an agent account</p>
    </div>

    <form id="signupForm" class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Full name</label>
        <input name="name" required autofocus class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" name="email" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" name="password" required minlength="6" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
        <p class="text-xs text-slate-400 mt-1">At least 6 characters</p>
      </div>

      <div id="formError" class="hidden text-sm text-red-600"></div>

      <button type="submit" class="w-full bg-slate-900 text-white font-medium py-2.5 rounded-lg hover:bg-slate-700 transition">
        Create Account
      </button>

      <p class="text-sm text-center text-slate-500">
        Already have an account? <a href="/login" class="text-slate-900 font-medium hover:underline">Log in</a>
      </p>
    </form>
  </div>

  <script>
    const form = document.getElementById("signupForm");
    const formError = document.getElementById("formError");

    if (getToken()) window.location.href = "/";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.classList.add("hidden");
      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const result = await apiPost("/api/auth/signup", data, true);
        setSession(result.access_token, result.agent);
        window.location.href = "/";
      } catch (err) {
        formError.textContent = "Signup failed: " + err.message;
        formError.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
