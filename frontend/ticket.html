<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ticket Detail — Support CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold text-slate-900">Ticket Detail</h1>
      <a href="/" class="text-sm text-slate-500 hover:text-slate-800">&larr; Back to tickets</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8">
    <div id="loadingState" class="text-center text-slate-400 py-16">Loading ticket...</div>
    <div id="errorState" class="hidden text-center text-red-500 py-16">Ticket not found.</div>

    <div id="ticketContent" class="hidden space-y-6">
      <div class="bg-white border border-slate-200 rounded-xl p-6">
        <div class="flex items-start justify-between mb-4">
          <div>
            <p class="text-xs font-mono text-slate-400" id="ticketIdLabel"></p>
            <h2 class="text-lg font-semibold text-slate-900" id="subjectLabel"></h2>
          </div>
          <div class="flex gap-2">
            <span id="priorityBadge" class="text-xs px-2 py-1 rounded-full"></span>
            <span id="slaBadge" class="hidden text-xs px-2 py-1 rounded-full bg-red-600 text-white">SLA breached</span>
            <span id="statusBadge" class="text-xs px-2 py-1 rounded-full"></span>
          </div>
        </div>

        <dl class="grid grid-cols-2 gap-3 text-sm mb-4">
          <div>
            <dt class="text-slate-400">Customer</dt>
            <dd id="customerName" class="font-medium"></dd>
          </div>
          <div>
            <dt class="text-slate-400">Email</dt>
            <dd id="customerEmail" class="font-medium"></dd>
          </div>
          <div>
            <dt class="text-slate-400">Created</dt>
            <dd id="createdAt" class="font-medium"></dd>
          </div>
          <div>
            <dt class="text-slate-400">Last updated</dt>
            <dd id="updatedAt" class="font-medium"></dd>
          </div>
        </dl>

        <div>
          <dt class="text-slate-400 text-sm mb-1">Description</dt>
          <dd id="description" class="text-sm whitespace-pre-wrap"></dd>
        </div>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl p-6">
        <h3 class="font-semibold mb-3">Update Ticket</h3>
        <form id="updateForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Status</label>
            <select id="statusSelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Add a note</label>
            <textarea id="noteInput" rows="3" placeholder="Internal note or update for the customer..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"></textarea>
          </div>
          <button type="submit" class="bg-slate-900 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-700 transition">
            Save
          </button>
          <span id="saveConfirm" class="hidden text-sm text-emerald-600 ml-2">Saved ✓</span>
        </form>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl p-6">
        <h3 class="font-semibold mb-3">Notes</h3>
        <div id="notesList" class="space-y-3"></div>
        <p id="noNotes" class="text-sm text-slate-400 hidden">No notes yet.</p>
      </div>
    </div>
  </main>

  <script>
    const ticketId = getQueryParam("id");
    const loadingState = document.getElementById("loadingState");
    const errorState = document.getElementById("errorState");
    const content = document.getElementById("ticketContent");

    async function loadTicket() {
      if (!ticketId) {
        loadingState.classList.add("hidden");
        errorState.classList.remove("hidden");
        return;
      }
      try {
        const t = await apiGet(`${API_BASE}/${encodeURIComponent(ticketId)}`);
        renderTicket(t);
        loadingState.classList.add("hidden");
        content.classList.remove("hidden");
      } catch (e) {
        loadingState.classList.add("hidden");
        errorState.classList.remove("hidden");
      }
    }

    function renderTicket(t) {
      document.getElementById("ticketIdLabel").textContent = t.ticket_id;
      document.getElementById("subjectLabel").textContent = t.subject;
      document.getElementById("customerName").textContent = t.customer_name;
      document.getElementById("customerEmail").textContent = t.customer_email;
      document.getElementById("createdAt").textContent = formatDate(t.created_at);
      document.getElementById("updatedAt").textContent = formatDate(t.updated_at);
      document.getElementById("description").textContent = t.description;

      const statusBadge = document.getElementById("statusBadge");
      statusBadge.textContent = t.status;
      statusBadge.className = "text-xs px-2 py-1 rounded-full " + statusBadgeClass(t.status);

      const priorityBadge = document.getElementById("priorityBadge");
      priorityBadge.textContent = t.priority;
      priorityBadge.className = "text-xs px-2 py-1 rounded-full " + priorityBadgeClass(t.priority);

      document.getElementById("slaBadge").classList.toggle("hidden", !t.is_sla_breached);

      document.getElementById("statusSelect").value = t.status;

      const notesList = document.getElementById("notesList");
      const noNotes = document.getElementById("noNotes");
      if (!t.notes.length) {
        notesList.innerHTML = "";
        noNotes.classList.remove("hidden");
      } else {
        noNotes.classList.add("hidden");
        notesList.innerHTML = t.notes
          .slice()
          .reverse()
          .map(
            (n) => `
          <div class="border-l-2 border-slate-200 pl-3">
            <p class="text-sm">${escapeHtml(n.note_text)}</p>
            <p class="text-xs text-slate-400 mt-0.5">${formatDate(n.created_at)}</p>
          </div>`
          )
          .join("");
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById("updateForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("statusSelect").value;
      const notes = document.getElementById("noteInput").value.trim();

      const body = { status };
      if (notes) body.notes = notes;

      try {
        await apiPut(`${API_BASE}/${encodeURIComponent(ticketId)}`, body);
        document.getElementById("noteInput").value = "";
        document.getElementById("saveConfirm").classList.remove("hidden");
        setTimeout(() => document.getElementById("saveConfirm").classList.add("hidden"), 2000);
        loadTicket();
      } catch (err) {
        alert("Failed to update ticket: " + err.message);
      }
    });

    loadTicket();
  </script>
</body>
</html>
